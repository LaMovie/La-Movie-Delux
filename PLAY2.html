/* --- ANIMACIÓN DE SALTOS PARA EL TÍTULO --- */
@keyframes saltoPalabra {
    0%, 15%, 100% {
        transform: translateY(0);
        color: #aaa;
        text-shadow: 0px .1px 0 #001;
    }
    5% {
        transform: translateY(-8px);
        color: #4f9;
        text-shadow: 0 0 10px rgba(68, 255, 153, 0.8);
    }
}

.salto-1 { display: inline-block; animation: saltoPalabra 6s infinite 0s; }
.salto-2 { display: inline-block; animation: saltoPalabra 6s infinite 0.25s; }
.salto-3 { display: inline-block; animation: saltoPalabra 6s infinite 0.5s; }
/* ------------------------------------------ */

.sug-wrapper {
    display: grid;
    overflow-x: auto;
    gap: 35px 15px; /* SOLUCIÓN AL ESPACIO: 35px separación vertical (row-gap), 15px horizontal (column-gap) */
    padding-bottom: 20px;
    grid-template-columns: repeat(2, 1fr);
}

.sug-item {
    width: 100%;
    cursor: none;
    text-align: center;
}

.sug-item img {
    width: 90%;
    height: 30vh;
    border-radius: 10px;
    object-fit: cover;
    transition: 0.4s ease;
    background: #001;
}

.sug-item img:hover {
    scale: 105%;
    border: 2px solid #4f9;
    box-shadow: 0 0 20px rgba(68, 255, 153, 0.6);
}

.sug-item h4 {
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    color: #ccc;
    margin-top: 10px;
    transition: 0.3s;
}

.sug-item:hover h4 {
    color: #4f9;
}

.sug-wrapper::-webkit-scrollbar {
    display: none;
}

<script>
var API_KEY = "e29e6334";
var tituloPredeterminado = T.textContent;

  <!-- Traducción con Google -->
async function traducir(texto) {
  try {
    var res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(texto)}`);
    var data = await res.json();
    return data[0][0][0]; // Texto traducido
  } catch (error) {
    console.error("Error al traducir:", error);
    return texto; // Si falla, muestra el original
  }
}

    <!-- OMDB API LÓGICA -->
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  var urlCapt = params.get('url');
  var tituloCapt = params.get('titulo');
  
  var tituloPredeterminado = tituloCapt; 

  // 1. Mostrar el título solo en el ID "T"
  if (tituloCapt) {
    var ElementoT = document.getElementById('T');
    if (ElementoT) ElementoT.textContent = tituloCapt;
  }

  // 2. Lógica del Iframe y Audio
  if (urlCapt) {
    var URL_FINAL = urlCapt;
    var esArchivoDrive = false; 

    if (urlCapt.includes('file')) {
      URL_FINAL = urlCapt.split('view')[0] + 'preview';
      esArchivoDrive = true; 
    } else if (urlCapt.includes('www.dropbox.com')) {
      URL_FINAL = urlCapt.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
    } else if (urlCapt.includes('play.vidyard')) {
      URL_FINAL = urlCapt; 
    }

    var iframe = document.getElementById('I');
    if (iframe) {
      iframe.src = URL_FINAL;
    }
    
    if (esArchivoDrive) {
      var audio = document.getElementById('AA');
      if (audio) {
        audio.play().catch(e => console.log("Audio bloqueado", e));
      }
    }
  }

  // 3. Integración de OMDb API
  if (tituloPredeterminado) {
    var Aux = document.getElementById("Aux");
    try {
      var response = await fetch("https://www.omdbapi.com/?t=" + encodeURIComponent(tituloPredeterminado) + "&apikey=" + API_KEY);
      var data = await response.json();

      if (data.Response === "False") {
        if (typeof S !== 'undefined') S.style.display = "block";
        return;
      }

      var titulo = await traducir(data.Title);
      var sinopsis = await traducir(data.Plot);
      var genero = await traducir(data.Genre);
      var director = await traducir(data.Director);
      var poster = data.Poster !== "N/A" ? data.Poster : "";

      Aux.innerHTML = `
        <div class="result-section">
          <img src="${poster}" alt="${titulo}" style="width: 20%; border-radius: 16px">
          <div class="result-title">${titulo} (${data.Year})</div>
          <p><strong>🎬 Género:</strong> ${genero}</p>
          <p><strong>🎥 Director:</strong> ${director}</p>
          <p><strong>📝 Sinopsis:</strong> ${sinopsis}</p>
        </div>
      `;
    } catch (error) {
      console.error("Error API OMDb:", error);
      if (Aux) Aux.innerHTML = "<img id='No' src='https://bit.ly/3y2BVCO'/><br/>";
    }
  }
});
</script>

function cargarSugerencias() {
    const contenedor = document.getElementById('Sugerencias');
    if (!contenedor) return;

    // 2. Mezclar el array aleatoriamente (Algoritmo Fisher-Yates)
    
    let mezcladas = [...baseDePeliculas].sort(() => 0.5 - Math.random());
    
    let seleccionadas = mezcladas.slice(0, 8);

     // AQUÍ SE APLICAN LOS SPANS PARA LA ANIMACIÓN DE SALTOS
     let html = '<h3 class="sug-titulo">🧋 <span class="salto-1">TE</span> <span class="salto-2">PODRÍA</span> <span class="salto-3">INTERESAR</span> 🧋</h3><div class="sug-wrapper">';

    seleccionadas.forEach(peli => {
        let tituloCodificado = encodeURIComponent(peli.titulo);
        let urlCodificada = encodeURIComponent(peli.url);
        
        let accionClick = peli.esDrive 
            ? `onclick="window.location.href='?titulo=${tituloCodificado}&url=${urlCodificada}'"`
            : `onclick="window.location.href='${peli.url}'"`;

        html += `
        <div class="sug-item" ${accionClick}>
            <img src="${peli.img}" alt="${peli.titulo}">
            <h4>${peli.titulo}</h4>
        </div>`;
    });
    
    html += '</div>';
    
 
    contenedor.innerHTML = html;
}

// Ejecutar cuando el reproductor termine de cargar
document.addEventListener('DOMContentLoaded', cargarSugerencias);

<script>

function abrirModalReporte() {

    }

    document.getElementById('titulo-reproduciendo').innerText = tituloActual;
    document.getElementById('modal-reporte').style.display = 'flex';
}

function cerrarModalReporte() {
    document.getElementById('modal-reporte').style.display = 'none';
    // Limpiar campos
    document.getElementById('motivo-reporte').value = "Enlace Caído";
    document.getElementById('pelicula-buscada').value = "";
    document.getElementById('grupo-buscada').style.display = 'none';
}

// MOSTRAR/OCULTAR CAMPO SI ES "Película No Encontrada"
function evaluarMotivo(valor) {
    const grupoBuscada = document.getElementById('grupo-buscada');
    if (valor === "Película No Encontrada") {
        grupoBuscada.style.display = 'block';
        document.getElementById('pelicula-buscada').focus();
    } else {
        grupoBuscada.style.display = 'none';
    }
}

   // ENVIAR REPORTE A FORMSUBMIT
function enviarReporte() {
    const titulo = document.getElementById('titulo-reproduciendo').innerText;
    const motivo = document.getElementById('motivo-reporte').value;
    const peliculaBuscada = document.getElementById('pelicula-buscada').value.trim();

    // Validación si eligió "Película No Encontrada" pero no escribió cuál
    if (motivo === "Película No Encontrada" && peliculaBuscada === "") {
        alert("Por favor, escribe el nombre de la película que estabas buscando.");
        document.getElementById('pelicula-buscada').focus();
        return;
    }

    const btnEnviar = document.getElementById('btn-enviar-reporte');
    const textoOriginal = btnEnviar.innerText;
    btnEnviar.innerText = "Enviando... ⏳";
    btnEnviar.disabled = true;

    // Construir los datos para el correo
    const datosEnvio = {
        _subject: `🚩 Reporte de Fallo: ${motivo} - ${titulo}`,
        "Película Afectada": titulo,
        "Motivo del Reporte": motivo
    };

    if (motivo === "Película No Encontrada") {
        datosEnvio["Película que buscaba el usuario"] = peliculaBuscada;
    }

    // Envío silencioso mediante FormSubmit
    fetch("https://formsubmit.co/ajax/EXPUSUPRA@proton.me", {
        method: "POST",
        headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(datosEnvio)
    })
    .then(response => response.json())
    .then(data => {
        alert("¡Muchas gracias! Tu reporte ha sido enviado con éxito.");
        cerrarModalReporte();
    })
    .catch(error => {
        alert("Hubo un error al enviar el reporte. Por favor intenta nuevamente.");
        console.error(error);
    })
    .finally(() => {
        btnEnviar.innerText = textoOriginal;
        btnEnviar.disabled = false;
    });
}
</script>
</body>
</html>
