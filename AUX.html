    <title>SEARCH?q=</title>

   <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"/>
<style>
body {     
    background: #000;   
}
.Div {
    color: gray;    
    width: 100%;
    height: 20vh;
    z-index: 9999;  
    position: fixed;
    background: #000;   
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Luckiest Guy', cursive;
    -webkit-text-stroke: .1px #003;
    text-shadow: 0px .1px 0 #001;  
}
#T {
    opacity: .6;
}
#F {
    width: 100%;
    height: 58vh;  
    margin-top: 10vh;
    aspect-ratio: 6/19;
    border-radius: 20px;
    border: none;
}
</style>
</head>
<body>
<center>
<div class="Div"><h3 id="T">La Movie Aux</h3></div>
     <iframe id="F" src="" frameborder="1" allowfullscreen="true" allow="encrypted-media" allow="autoplay" scrolling="no" sandbox="allow-scripts allow-same-origin"></iframe>  
            
</center>
<script>
     var params = new URLSearchParams(window.location.search);
 var TITULO = params.get('titulo');
   var URL = params.get('url');
   
         if (TITULO && URL) {
    F.src = URL; 
    T.textContent = TITULO;
  }    
  
    var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
       if (!isMobile) {
 var TITULO = TITULO.replace('🍿', '')         
      window.location.href = `https://www.google.com/search?q=site:sololatino.net+${TITULO}`;
    };       
</script>
</body>
