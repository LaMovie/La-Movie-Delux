    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧋PLAY AUX🧋</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"/>
<style>
/* Reseteo base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {     
    background: #000;
    overflow: hidden;
}
.Div {
    width: 100%;
    height: 20vh; 
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    background: #000; 
    display: flex;
    flex-direction: column; 
    align-items: center;
    justify-content: center;
    gap: 3vh; 
    font-family: 'Luckiest Guy', cursive;
    -webkit-text-stroke: .1px #003;
    text-shadow: 0px .1px 0 #001;  
}
#T {
    color: gray;
    opacity: .6;
}
#Cap {
    color: #4f9;
    opacity: .7;
    font-size: 1.1rem;
}
#F {
    width: 100%;
    height: 63vh;
    margin-top: 10vh; 
    border: none;
}
#Caja {
    display: flex;
    align-items: center;
    gap: 15px; 
    width: 100%;
    position: fixed;
    bottom: 10vh; /* Lo pega en la parte de abajo de la pantalla */
    left: 0;
    z-index: 9999;
    overflow-x: auto; 
    padding: 10px 20px;
    
    /* Oculta la barra de scroll estética en algunos navegadores para un diseño más limpio */
    scrollbar-width: none; 
}
#Caja::-webkit-scrollbar {
    display: none;
}
.Btn {
    background: blue;
    color: white;
    opacity: .9;
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-family: sans-serif;
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0; /* CRUCIAL: Evita que los botones se aplasten para que el scroll horizontal funcione */
    white-space: nowrap; /* Evita que el texto salte a una segunda línea */
    transition: 0.3s ease;
}
.Btn:hover {
    border: 1px solid #f03;
}
</style>
</head>
<body>
    
        <div class="Div">
  <h3 id="T">La Movie Aux</h3>
        <p id="Cap"></p>
            </div>
    
    <iframe id="F" src="" frameborder="1" allowfullscreen="true" allow="encrypted-media" allow="autoplay" scrolling="no" sandbox="allow-scripts allow-same-origin"></iframe>  

      <div id="Caja"></div>

<script src="https://lamovie.github.io/Buscador/Buscador3.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var TITULO = params.get('titulo');
var URL = params.get('url');
   
   if (TITULO && URL) {
        F.src = URL; 
        T.textContent = TITULO;

    var serie = Lista3.find(item => (item.NAME || item.name) === TITULO);

    if (serie && serie.CAPS) {
  serie.CAPS.forEach(capitulo => {
          var boton = document.createElement('a');
 boton.textContent = capitulo.cap;
 Cap.textContent = '1x01';
     boton.className = 'Btn';
            
     boton.onclick = (e) => {
   e.preventDefault();
       F.src = capitulo.link;
                
                // Restablecer estilos a todos los botones hermanos
  var btn = Caja.querySelectorAll('.Btn');
    
   btn.label = btn.forEach(b => {
      b.style.color = 'white';
      b.style.background = 'blue';
  });

       // Aplicar estilo al botón seleccionado
  boton.style.color = '#000';
  boton.style.background = '#4f9';
  Cap.textContent = capitulo.cap;
            };
            
        Caja.appendChild(boton);
     });
   }
}

     var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (!isMobile) {
    var TITULO = TITULO ? TITULO.replace('🍿', '') : '';     
    window.location.href = `https://www.google.com/search?q=site:sololatino.net+${TITULO}`;
}
</script>
</body>
</html>
