<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    color: #000;
    background: #000;
}
input {
    opacity: 0;
}
</style>
</head>
<body>
  <input type="text" id="R"/>
<script>
window.addEventListener('DOMContentLoaded', () => {
       const params = new URLSearchParams(window.location.search);
        const textCapt = params.get('texto');
    
       if (textCapt) {
    R.value = textCapt;
    }
 
 
       const urlDestino = `${'go:GOOGLE'}?texto=${textCapt}`;
      
 window.location.href = urlDestino;
     
 });
</script> 
</body>
</html>
