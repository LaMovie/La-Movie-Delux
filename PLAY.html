<div id="modal-reporte" class="modal-overlay-reporte">
    <div class="modal-reporte-content">
        <h3>🚩 Reportar Fallo</h3>
        
        <!-- Muestra el título que se está reproduciendo -->
        <div class="pelicula-detectada">
            🎬 <strong>Película:</strong> <span id="titulo-reproduciendo">Cargando...</span>
        </div>

        <!-- SELECT (Lista desplegable de opciones) -->
        <div class="campo-grupo">
            <label for="motivo-reporte">¿Cuál es el problema?</label>
            <select id="motivo-reporte" class="select-reporte" onchange="evaluarMotivo(this.value)">
                <option value="Enlace Caído">Enlace Caído</option>
                <option value="Reproducción Lenta">Reproducción Lenta</option>
                <option value="No Es El Título">No Es El Título</option>
                <option value="Hay Anuncios">Hay Anuncios</option>
                <option value="Película No Encontrada">Película No Encontrada</option>
            </select>
        </div>

        <!-- CAMPO CONDICIONAL (Solo aparece si selecciona "Película No Encontrada") -->
        <div class="campo-grupo" id="grupo-buscada" style="display: none;">
            <label for="pelicula-buscada">¿Qué película estabas buscando?</label>
            <input type="text" id="pelicula-buscada" class="input-reporte" placeholder="Ej: Men In Black">
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="modal-reporte-botones">
            <button class="btn-modal-rep btn-cancelar-rep" onclick="cerrarModalReporte()">Cancelar</button>
            <button class="btn-modal-rep btn-enviar-rep" id="btn-enviar-reporte" onclick="enviarReporte()">Enviar Reporte</button>
        </div>
